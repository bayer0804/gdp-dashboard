name: Build Retro Arcade APK

on:
  push:
    branches:
      - retro-arcade-apk-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-apk
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp android-apk/app/build/outputs/apk/debug/app-debug.apk RetroArcadeDeluxe.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroArcadeDeluxe-APK
          path: RetroArcadeDeluxe.apk
          if-no-files-found: error
